<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console Verification -->
    <meta
      name="google-site-verification"
      content="n2c2Tog0hp7M2DGxOJWrCN6dXdZvw3gfID9Wz-9eCUA"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
      StudyCopilot - AI Powered Learning Assistant
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="StudyCopilot is an AI-powered learning workspace where students upload documents, generate summaries, create quizzes, flashcards and personalized study plans."
    />

    <meta
      name="keywords"
      content="AI learning assistant, PDF AI chatbot, study planner, AI notes, AI quiz generator, flashcards, student productivity"
    />

    <meta name="author" content="StudyCopilot" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="StudyCopilot - AI Powered Learning Assistant"
    />

    <meta
      property="og:description"
      content="Study smarter with AI powered summaries, notes, quizzes, flashcards and personalized learning plans."
    />

    <meta
      property="og:image"
      content="/logo.png"
    />

    <meta
      property="og:url"
      content="https://studycopilot.me"
    />

    <meta
      property="og:type"
      content="website"
    />

    <!-- Twitter Card -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="StudyCopilot - AI Learning Assistant"
    />

    <meta
      name="twitter:description"
      content="Your AI powered workspace for smarter learning."
    />

    <meta
      name="twitter:image"
      content="/logo.png"
    />

    <!-- Browser Theme -->
    <meta
      name="theme-color"
      content="#0b1020"
    />
